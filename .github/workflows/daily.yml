name: daily-intake
on:
  schedule: [{cron: "20 11 * * *"}]   # 06:20 CT daily
  workflow_dispatch:
    inputs:
      source:
        description: "One collector only (no normalization, review PR or notification)"
        type: choice
        options: [all, tceq-permit-portal, opsb-dockets]
        default: all
permissions:
  contents: write
  pull-requests: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx pyyaml rapidfuzz pypdf boto3
      - name: Run watchers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          SOURCE_ID: ${{ inputs.source || 'all' }}
        run: |
          if [ "$SOURCE_ID" = all ]; then
            PYTHONPATH=engine/src python -m btw_engine.watch
          else
            PYTHONPATH=engine/src python -m btw_engine.watch --source "$SOURCE_ID"
          fi
      - name: Normalize claims into provenance + staged facts
        if: inputs.source == '' || inputs.source == 'all'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: "5ee73f367499e0cda9acfbd5966274e5"
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
        run: PYTHONPATH=engine/src python -m btw_engine.normalize
      - name: Open review PR
        if: inputs.source == '' || inputs.source == 'all'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMERGE: "false"
        run: PYTHONPATH=engine/src python -m btw_engine.review --open
      - name: SLO staleness check
        if: always() && (inputs.source == '' || inputs.source == 'all')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: PYTHONPATH=engine/src python -m btw_engine.watch --slo
      - name: Telegram report (ok or alert)
        if: always() && (inputs.source == '' || inputs.source == 'all')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: PYTHONPATH=engine/src python -m btw_engine.notify
