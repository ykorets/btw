name: btw-hotfix
on:
  workflow_dispatch:
    inputs:
      facility: {description: "facility slug (optional)", required: false, default: ""}
      date: {description: "event date YYYY-MM-DD", required: true}
      type: {description: "event type (enforcement/filing/observation/...)", required: true}
      headline: {description: "one-line headline", required: true}
      url: {description: "public evidence URL", required: true}
permissions:
  contents: write
  pull-requests: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx
      - name: Stage event + open review PR
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_FACILITY: ${{ inputs.facility }}
          EVENT_DATE: ${{ inputs.date }}
          EVENT_TYPE: ${{ inputs.type }}
          EVENT_HEADLINE: ${{ inputs.headline }}
          EVENT_URL: ${{ inputs.url }}
        run: |
          args=(--date "$EVENT_DATE" --type "$EVENT_TYPE" --headline "$EVENT_HEADLINE" --url "$EVENT_URL")
          if [ -n "$EVENT_FACILITY" ]; then args+=(--facility "$EVENT_FACILITY"); fi
          PYTHONPATH=engine/src python -m btw_engine.hotfix "${args[@]}"
