name: archive-backfill
on:
  workflow_dispatch:
    inputs:
      manifest:
        description: "Document batch when URL is blank"
        type: choice
        options: [genesis, refresh-2026-10, opsb-public-2026-10]
        default: genesis
      url:
        description: "Optional single public-record URL; blank runs the manifest"
        default: ""
      genre:
        description: "Document genre for a single URL"
        default: "permit"
      source:
        description: "Registered source id for a single URL"
        default: "manual-genesis"
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"
      - name: Install the locked engine runtime
        run: uv sync --locked --extra dev
        working-directory: engine
      - name: Install ordinary Chromium for public OPSB PDFs
        if: inputs.manifest == 'opsb-public-2026-10' && inputs.url == ''
        run: engine/.venv/bin/playwright install --with-deps --no-shell chromium
      - name: Archive genesis documents to R2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: "5ee73f367499e0cda9acfbd5966274e5"  # account id is not a secret (visible in dashboard URLs)
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          ARCHIVE_URL: ${{ inputs.url }}
          ARCHIVE_GENRE: ${{ inputs.genre || 'permit' }}
          ARCHIVE_SOURCE: ${{ inputs.source || 'manual-genesis' }}
          ARCHIVE_MANIFEST: ${{ inputs.manifest || 'genesis' }}
        run: |
          if [ -n "$ARCHIVE_URL" ]; then
            engine/.venv/bin/python -m btw_engine.fetch \
              --url "$ARCHIVE_URL" --genre "$ARCHIVE_GENRE" --source "$ARCHIVE_SOURCE"
          elif [ "$ARCHIVE_MANIFEST" = "refresh-2026-10" ]; then
            engine/.venv/bin/python -m btw_engine.fetch \
              --backfill engine/backfill/refresh_2026_10.yaml
          elif [ "$ARCHIVE_MANIFEST" = "opsb-public-2026-10" ]; then
            xvfb-run -a engine/.venv/bin/python -m btw_engine.opsb_documents \
              --manifest engine/backfill/opsb_public_2026_10_28.json --archive
          else
            engine/.venv/bin/python -m btw_engine.fetch \
              --backfill engine/backfill/genesis_docs.yaml
          fi
