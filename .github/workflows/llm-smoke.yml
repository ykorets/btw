name: llm-smoke
on:
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: "engine/uv.lock"
      - name: Install the locked engine runtime (same litellm as production)
        run: uv sync --locked
        working-directory: engine
      - name: Smoke-test every role with an available provider key
        env:
          BTW_API_URL: https://data-api.behindthewatt.com
          BTW_API_KEY: ${{ secrets.BTW_API_KEY }}
          BTW_ACCESS_CLIENT_ID: ${{ secrets.BTW_ACCESS_CLIENT_ID }}
          BTW_ACCESS_CLIENT_SECRET: ${{ secrets.BTW_ACCESS_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BTW_MODELS_YAML: engine/models.yaml
        run: engine/.venv/bin/python -m btw_engine.llm --smoke
