# GDELT DOC 2.0 news feed — candidate per article matching the BTM query.
# Free, keyless, deduped by article-URL hash.
id: gdelt-news
kind: api
adapter: gdelt_news
url: https://api.gdeltproject.org/api/v2/doc/doc
schedule: daily
slo_interval_days: 3
params:
  # Discovery only: a match becomes a candidate, never a published topology.
  # Include UK spelling because Dublin/London private-power projects are now
  # useful leads even while the verified fleet remains US-first.
  query: '("data center" OR "data centre") ("behind the meter" OR "on-site generation" OR "onsite power" OR "self-generation" OR microgrid OR "private wire" OR "non-export" OR "co-located load")'
  timespan: 2d
  maxrecords: 40
